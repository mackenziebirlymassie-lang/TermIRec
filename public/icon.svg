<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="12" />

  <!-- Window Chrome Header -->
  <rect x="40" y="48" width="432" height="60" rx="16" fill="#1e293b" />
  <circle cx="76" cy="78" r="12" fill="#ef4444" />
  <circle cx="112" cy="78" r="12" fill="#f59e0b" />
  <circle cx="148" cy="78" r="12" fill="#10b981" />

  <!-- Recording Badge / Dot -->
  <circle cx="436" cy="78" r="10" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Terminal Content Area -->
  <rect x="40" y="108" width="432" height="356" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="4" />

  <!-- Terminal Command Prompt "> _" -->
  <path d="M100 180 L180 240 L100 300" fill="none" stroke="url(#glow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="220" y="276" width="100" height="24" rx="4" fill="#38bdf8" />

  <!-- SVG Play Wave / Tape Reel hint -->
  <circle cx="360" cy="380" r="36" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="8 8" />
  <circle cx="360" cy="380" r="14" fill="#ef4444" />
</svg>
